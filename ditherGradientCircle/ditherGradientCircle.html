<!doctype html>
	<head>
		<style>
		body {
			display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
		}
    dither-gradient-circle {
      position: relative;
      border-radius: 5rem;
      width: 10rem;
      height: 10rem;
      background:  linear-gradient(
        rgba(0, 0, 0, 1),
        rgba(255, 255, 255, 0)
      );
    }
    dither-gradient-circle::after {
      position: absolute;
      border-radius: 5rem;
      width: 10rem;
      height: 10rem;
      content: '';
      background: url(./dot.png) repeat;
    }
		</style>
	</head>
	<body>
    <dither-gradient-circle />
	</body>
