<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>UI Experiments</title>
    <link rel="stylesheet" href="styles.css" />
  <body>
    <template id="main-template">
      <main class="hidden">
        <section id="introduction">
          <fieldset>
            <legend>Introduction</legend>
            <h1>
              UI-Experiments
            </h1>
            <p id="description">
          </fieldset>
        </section>
        <section id="experiments-list">
          <fieldset>
            <legend>Experiments</legend>
            <ul></ul>
          </fieldset>
        </section>
        <section id="experiment">
          <fieldset>
            <legend>Demonstration:</legend>
            <iframe id="experiment-frame"></iframe>
          </fieldset>
        </section>
        <section >
          <fieldset>
            <legend>Description:</legend>
            <p id="experiment-description"></p>
          </fieldset>
        </section>
        <section id="examples">
          <fieldset>
            <legend>Examples:</legend>
          </fieldset>
        </section>
      </main>
    </template>

    <template id="spinner-template">
      <div id="spinner" class="hidden">
        <div></div>
      </div>
    </template>

    <template id="experiment-link">
      <li>
        <button></button>
      </li>
    </template>

    <script src="index.js" defer></script>
  </body>
</html>
