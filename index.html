<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>UI Experiments</title>
    <link rel="stylesheet" href="styles.css" />
  <body>
    <main>
      <div>
        UI-Experiments
        <pre>
          An library of unsorted UI experiments. Mostly used with pure vanilla javascript.
        </pre>
        <ul id="links"></ul>
      </div>
      <div>
        <iframe id="experiment">

        </iframe>
      </div>
      <div>
      </div>
    </main>

    <div class="exp__spinner-backdrop">
      <img src="spinner.svg" alt="Loading" />
    </div>

    <script>
      setTimeout(() => {
        const kana = document.getElementsByClassName("exp__spinner-backdrop")?.[0];
        if (kana) {
          kana.classList.add("exp__spinner-backdrop--has-loaded");
          setTimeout(() => {
            document.body.removeChild(kana);
          },351);
        }
      }, 2000)
    </script>
  </body>
</html>
