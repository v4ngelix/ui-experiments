<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UI Experiments</title>
    <link rel="stylesheet" href="./styles.css" />
  <body>
    <template id="main-template">
      <main class="hidden">
        <section id="introduction">
          <fieldset>
            <legend>Introduction</legend>
            <h1>
              UI-Experiments
            </h1>
            <p id="description"></p>
          </fieldset>
        </section>
        <section id="experiments-list">
          <fieldset>
            <legend>Experiments</legend>
            <ol></ol>
          </fieldset>
        </section>
        <section id="experiment">
          <fieldset>
            <legend>Demonstration:</legend>
            <iframe id="experiment-frame"></iframe>
          </fieldset>
        </section>
        <section id="experiment-description">
          <fieldset>
            <legend>Description:</legend>
            <p></p>
          </fieldset>
        </section>
        <section id="inspiration">
          <fieldset>
            <legend>Inspiration:</legend>
          </fieldset>
        </section>
      </main>
    </template>

    <div id="spinner" class="hidden">
      <div></div>
    </div>

    <template id="experiment-link">
      <li>
        <button></button>
      </li>
    </template>

    <script src="index.js" defer></script>
  </body>
</html>
