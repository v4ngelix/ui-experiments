<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>UI Experiments</title>
    <link rel="stylesheet" href="styles.css" />
  <body>
    <template id="main-template">
      <main>
        <section id="introduction">
            <h1>
              UI-Experiments
            </h1>
            <p id="description">
            An library of unsorted UI experiments. Mostly used with pure vanilla javascript.
          </p>
        </section>
        <section id="experiments-list">
          <ul>
            <li>
              <button>
                Circle with dithering and a gradient
              </button>
            </li>
          </ul>
          experiments-list
        </section>
        <section id="experiment">
          <iframe id="experiment-frame">experiments</iframe>
        </section>
        <section id="experiment-description">experiment-description</section>
        <section id="examples">examples</section>
      </main>
    </template>

    <template id="spinner-template">
      <div id="spinner">
        <div></div>
      </div>
    </template>

    <script src="index.js" defer></script>
  </body>
</html>
