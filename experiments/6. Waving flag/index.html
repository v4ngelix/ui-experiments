<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waving flag</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #eef1f4;
      overflow: hidden;
    }
    canvas {
      display: block;
      image-rendering: pixelated; /* keep the chunky low-res pixels when upscaled */
      width: 100dvw;
      height: 100dvh;
    }
  </style>
</head>
<body>
<canvas id="flag"></canvas>
<script>
  const canvas = document.getElementById('flag');
  const gl = canvas.getContext('webgl2', { antialias: false });

  const vertexSource = `#version 300 es
    in vec2 aPos;           // 0..1 across the cloth
    uniform float uTime;
    out vec2 vUv;

    float wave(vec2 p) {
      float t = uTime;
      float z = 0.09 * sin(p.x * 5.0 - t * 1.8 + p.y * 1.2)
              + 0.035 * sin(p.x * 11.0 - t * 2.7 - p.y * 2.3)
              + 0.015 * sin(p.x * 19.0 - t * 3.6 + p.y * 4.0);
      return z;
    }

    void main() {
      float z = wave(aPos);
      vUv = aPos;

      // Cloth pulls in slightly where it bulges. The plane overscans the screen
      // (-OVERSCAN..OVERSCAN) so its wavy edges never come into view.
      const float OVERSCAN = 1.3;
      vec2 p = (aPos - 0.5) * 2.0 * OVERSCAN;
      p.x -= z * 0.25;
      p.y += z * 0.35;
      gl_Position = vec4(p, z, 1.0 + z * 0.8);
    }
  `;

  const fragmentSource = `#version 300 es
    precision highp float;
    in vec2 vUv;
    uniform vec2 uPatternSize; // plane size in reference-image pixels
    out vec4 outColor;

    const vec3 BLUE = vec3(0.0, 0.6, 0.839);
    const vec3 WHITE = vec3(1.0);

    void main() {
      // Lozenge grid measured from the reference image (1600 x 960 px).
      vec2 px = vec2(vUv.x, 1.0 - vUv.y) * uPatternSize - vec2(240.0, 251.0);
      mat2 basis = mat2(400.0, 102.0, 160.0, 355.0);
      vec2 cell = inverse(basis) * px;

      // Sign flips on every grid line; a hard step keeps the edges aliased.
      float s = sin(3.14159265 * cell.x) * sin(3.14159265 * cell.y);
      outColor = vec4(s > 0.0 ? WHITE : BLUE, 1.0);
    }
  `;

  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(shader);
    return shader;
  }

  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
  gl.linkProgram(program);
  gl.useProgram(program);

  // Dense grid of triangles so the waves bend smoothly.
  const cols = 160, rows = 96;
  const vertices = [];
  for (let j = 0; j <= rows; j++) {
    for (let i = 0; i <= cols; i++) vertices.push(i / cols, j / rows);
  }
  const indices = [];
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const a = j * (cols + 1) + i, b = a + 1, c = a + cols + 1, d = c + 1;
      indices.push(a, b, c, b, d, c);
    }
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(program, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(indices), gl.STATIC_DRAW);

  const uTime = gl.getUniformLocation(program, 'uTime');
  const uPatternSize = gl.getUniformLocation(program, 'uPatternSize');

  // Size of one rendered pixel in CSS pixels. Bigger = chunkier retro look.
  const PIXEL_SIZE = 4;
  const OVERSCAN = 1.3; // keep in sync with the vertex shader

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.ceil(w / PIXEL_SIZE);
    canvas.height = Math.ceil(h / PIXEL_SIZE);
    gl.viewport(0, 0, canvas.width, canvas.height);

    // Scale the pattern like background-size: cover of the 1600 x 960 reference.
    const PATTERN_SCALE = 0.7; // 1 = original size, 0.5 = half size
    const cover = Math.max(w / 1600, h / 960) * PATTERN_SCALE;
    gl.uniform2f(uPatternSize, w * OVERSCAN / cover, h * OVERSCAN / cover);
  }
  window.addEventListener('resize', resize);
  resize();

  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.933, 0.945, 0.957, 1);

  function frame(ms) {
    gl.uniform1f(uTime, ms / 1000);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_INT, 0);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
